# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
# path: ../MSOD/VH/ # dataset root dir
train: 
  - ../MSOD/vh/images/train # train images (relative to 'path') 10,000 images
  - ../MSOD/vv/images/train # train images (relative to 'path') 10,000 images

val: 
  - ../MSOD/vh/images/val # val images (relative to 'path') 4,000 images
  - ../MSOD/vv/images/val # val images (relative to 'path') 4,000 images
test: 
  - ../MSOD/vh/images/test # test images (optional) 6,000 images
  - ../MSOD/vv/images/test # test images (optional) 6,000 images

# Classes for MSOD
names:
  0: playground
  1: airport
  2: wind_turbine
  3: oil_tank
  4: bridge
  5: harbor
  


